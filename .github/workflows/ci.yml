name: Rust CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.86.0
          override: true

      - name: Build with Cargo
        run: cargo build --release
      - name: Run tests
        run: cargo test --verbose

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build Docker Image
        run: docker build -t getch12/todo-list:latest .

      - name: Push Docker Image to Docker Hub
        run: docker push getch12/todo-list:latest

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p ~/todo-app
            cd ~/todo-app

            curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/master/docker-compose.yml -o docker-compose.yml
            sudo docker pull getch12/todo-list:latest
            sudo docker-compose down -v
            sudo docker-compose up -d
#            sudo docker rm -f todo-app || true
#            sudo docker pull getch12/todo-list:latest
#            sudo docker run -d -p 3000:3000 --name todo-app getch12/todo-list:latest


